[package]
name = "gitreant"
version = "0.1.0"
edition = "2021"
description = "Serve git commit graphs of local repositories as a single-page web app"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ShortArrow/gitreant"
readme = "README.md"
keywords = ["git", "graph", "web", "gui"]
categories = ["development-tools", "visualization"]
# The published crate ships the PREBUILT frontend (dist is gitignored but
# packaged via this include list), so `cargo install gitreant` needs no
# Node.js — build.rs only writes its placeholder when dist is absent.
include = [
    "/src/**",
    "/tests/**",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/frontend/dist/**",
]

[lib]
name = "gitreant"
path = "src/lib.rs"

[[bin]]
name = "gitreant"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
gix = "0.85.0"
mime_guess = "2.0.5"
open = "5.3.6"
rfd = "0.17.2"
rust-embed = "8.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }

[profile.release]
strip = true

[dev-dependencies]
tempfile = "3.27.0"
