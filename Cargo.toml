[package]
name = "gitreant"
version = "0.2.2"
edition = "2021"
description = "Serve git commit graphs of local repositories as a single-page web app"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ShortArrow/gitreant"
readme = "README.md"
keywords = ["git", "graph", "web", "gui"]
categories = ["development-tools", "visualization"]
# The published crate ships the PREBUILT frontend (dist is gitignored but
# packaged via this include list), so `cargo install gitreant` needs no
# Node.js — build.rs only writes its placeholder when dist is absent.
include = [
    "/src/**",
    "/tests/**",
    "/build.rs",
    "/Cargo.toml",
    "/README.md",
    "/LICENSE-MIT",
    "/LICENSE-APACHE",
    "/frontend/dist/**",
    "/frontend/public/favicon.ico",
]

[lib]
name = "gitreant"
path = "src/lib.rs"

[[bin]]
name = "gitreant"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
gix = "0.85.0"
mime_guess = "2.0.5"
rust-embed = "8.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }

# Desktop conveniences with no Android backend (Termux): the browser/file
# opener and the native folder picker degrade gracefully there instead.
[target.'cfg(not(target_os = "android"))'.dependencies]
open = "5.3.6"
rfd = "0.17.2"

[profile.release]
strip = true

[dev-dependencies]
tempfile = "3.27.0"

# The executable's icon is a Windows resource; other targets have no
# equivalent and skip it (see build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.31"
