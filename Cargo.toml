[package]
name = "gitreant"
version = "0.1.0"
edition = "2021"
description = "Serve git commit graphs of local repositories as a single-page web app"

[lib]
name = "gitreant"
path = "src/lib.rs"

[[bin]]
name = "gitreant"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
clap = { version = "4.6.1", features = ["derive"] }
gix = "0.85.0"
mime_guess = "2.0.5"
open = "5.3.6"
rust-embed = "8.11.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "signal"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }

[profile.release]
strip = true

[dev-dependencies]
tempfile = "3.27.0"
