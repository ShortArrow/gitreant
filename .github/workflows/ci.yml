name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned to commit SHAs (ADR 0030); the trailing comment names
# the release each SHA was taken from.

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # macos pinned explicitly: the macos-latest label is mid-migration to
        # macOS 26 (actions/runner-images#14167); opt in instead of drifting.
        # The arm entries are GitHub's native arm64 runners (free on public
        # repositories): Windows-on-ARM and Raspberry-Pi-class Linux.
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            macos-26,
            windows-latest,
            windows-11-arm,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # rfd links system libwayland on Linux (wayland-backend `client_system`).
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # build.rs writes a placeholder frontend/dist so rust-embed compiles
      # without a frontend build.
      - run: cargo build --verbose
      - run: cargo test --verbose

  android:
    # Termux ships from a cross build (rfd/open are cfg'd out on Android);
    # keep it compiling on every push so a tag never discovers the breakage.
    name: Android (cargo check)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Configure the Android NDK toolchain
        run: |
          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK_HOME" ]; then
            NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/*/ 2>/dev/null | sort -V | tail -1)"
          fi
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          echo "CC_aarch64_linux_android=${TOOLCHAIN}/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${TOOLCHAIN}/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${TOOLCHAIN}/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - run: cargo check --target aarch64-linux-android

  web:
    name: Frontend + Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the declared pnpm version
        id: pnpm
        run: >
          echo "version=$(jq -r .packageManager
          "$GITHUB_WORKSPACE/frontend/package.json" | cut -d@ -f2)"
          >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ steps.pnpm.outputs.version }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - run: pnpm build
      - run: pnpm build-storybook

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Read the declared pnpm version
        id: pnpm
        run: >
          echo "version=$(jq -r .packageManager
          "$GITHUB_WORKSPACE/frontend/package.json" | cut -d@ -f2)"
          >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{ steps.pnpm.outputs.version }}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install frontend dependencies
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Install Playwright browser
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      # global-setup builds the frontend and the gitreant binary, spawns the
      # server against fixture repositories, and tears it down afterwards.
      - name: Run E2E
        working-directory: frontend
        run: pnpm test:e2e

  docs-tandem:
    name: Bilingual docs updated together
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The tandem check diffs against the push base / PR base.
          fetch-depth: 0
      - name: Examples of the tandem check
        run: bash .github/scripts/test-docs-tandem.sh
      - name: Check .jp.md / .md pairs change together
        run: >
          bash .github/scripts/check-docs-tandem.sh
          "${{ github.event.pull_request.base.sha || github.event.before }}"
          "${{ github.sha }}"

  release-scripts:
    # The release workflow only runs on a tag, so its scripts are exercised
    # here, along with the changelog the next release will read.
    name: Release scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: bash .github/scripts/test-release-scripts.sh
      - name: The released version has notes in CHANGELOG.md
        run: >
          bash .github/scripts/release-notes.sh
          "$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          >/dev/null
