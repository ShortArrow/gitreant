name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  test:
    # Gate the release on tests passing on every platform we ship for; a tag
    # push would otherwise produce artifacts from a commit whose tests never
    # ran before this workflow.
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        # The arm entries are GitHub's native arm64 runners (free on public
        # repositories), so Windows-on-ARM and Raspberry-Pi-class Linux run
        # the full test suite natively before we ship for them.
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            windows-latest,
            windows-11-arm,
            macos-26,
          ]
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --locked

  build:
    # Desktop targets build natively (GitHub has free arm64 runners for
    # public repositories, so no cross toolchains for rfd's GUI libraries);
    # Android (Termux) is the one cross build, linked with the NDK's clang —
    # rfd/open are cfg'd out there.
    name: Build (${{ matrix.target }})
    needs: test
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-26
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-26
            archive: tar.gz
          - target: aarch64-linux-android
            os: ubuntu-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps
        if: runner.os == 'Linux' && matrix.target != 'aarch64-linux-android'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Configure the Android NDK toolchain
        if: matrix.target == 'aarch64-linux-android'
        run: |
          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK_HOME" ]; then
            NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/*/ 2>/dev/null | sort -V | tail -1)"
          fi
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          echo "CC_aarch64_linux_android=${TOOLCHAIN}/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${TOOLCHAIN}/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${TOOLCHAIN}/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../gitreant-${{ matrix.target }}.tar.gz gitreant

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/gitreant.exe -DestinationPath gitreant-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: gitreant-${{ matrix.target }}
          path: gitreant-${{ matrix.target }}.*

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Required for actions/attest-build-provenance to mint a Sigstore
      # signing certificate via the GitHub OIDC provider.
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Attest build provenance
        # Signed SLSA provenance for every artifact, published before the
        # release itself so a failure aborts instead of shipping unattested
        # binaries. GitHub does not offer attestations on user-owned PRIVATE
        # repositories, so this arms itself automatically when the repo goes
        # public.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: artifacts/*

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        # SemVer marks pre-releases with a hyphen (v0.1.0-pre, v1.0.0-rc.1);
        # mirror that on the GitHub release.
        run: |
          case "$TAG" in
            *-*) prerelease=--prerelease ;;
            *) prerelease= ;;
          esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --generate-notes \
            $prerelease \
            artifacts/*

  publish-crates:
    # Publish to crates.io via OIDC Trusted Publishing — no long-lived
    # CARGO_REGISTRY_TOKEN anywhere. The crate ships the prebuilt frontend
    # (see the include list in Cargo.toml), so the frontend build must run
    # before packaging. Set `[skip publish]` in the tagged commit message
    # to bypass this job.
    name: Publish to crates.io (OIDC)
    needs: [test, build, release]
    if: ${{ !contains(github.event.head_commit.message, '[skip publish]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v6
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Exchange OIDC token for crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      - name: Dry-run publish (sanity check)
        # Catches packaging issues (missing dist, manifest rejection) before
        # the real publish; skipped when this version is already published
        # so tag-rerun after a glitch stays green.
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          status=$(curl -fsS -A "gitreant-release (github.com/ShortArrow/gitreant)" -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/gitreant/$version" || echo "000")
          if [ "$status" = "200" ]; then
            echo "gitreant $version already on crates.io — skipping dry-run"
          else
            # --allow-dirty: the packaged frontend/dist is generated in the
            # previous step and never committed; the checkout is otherwise
            # pristine on CI.
            cargo publish --dry-run --allow-dirty
          fi

      - name: Publish gitreant
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          status=$(curl -fsS -A "gitreant-release (github.com/ShortArrow/gitreant)" -o /dev/null -w '%{http_code}' \
            "https://crates.io/api/v1/crates/gitreant/$version" || echo "000")
          if [ "$status" = "200" ]; then
            echo "gitreant $version already on crates.io — skipping publish"
          else
            # --allow-dirty: see the dry-run step.
            cargo publish --allow-dirty
          fi
