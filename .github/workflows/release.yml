name: Release

# How a release is guarded is ADR 0030. Actions are pinned to commit SHAs;
# the trailing comment names the release each SHA was taken from.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    # A release tag must sit on main, name the version in Cargo.toml and have
    # a CHANGELOG.md section. A prerelease tag (one containing "-") rehearses
    # the pipeline at whatever version main carries, so only the main check
    # applies to it.
    name: Check the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: The tag matches Cargo.toml and CHANGELOG.md
        run: bash .github/scripts/check-release-tag.sh "$GITHUB_REF_NAME"

  test:
    # Gate the release on tests passing on every platform we ship for; a tag
    # push would otherwise produce artifacts from a commit whose tests never
    # ran before this workflow.
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        # The arm entries are GitHub's native arm64 runners (free on public
        # repositories), so Windows-on-ARM and Raspberry-Pi-class Linux run
        # the full test suite natively before we ship for them.
        os:
          [
            ubuntu-latest,
            ubuntu-24.04-arm,
            windows-latest,
            windows-11-arm,
            macos-26,
          ]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build deps
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - run: cargo test --locked

  build:
    # Desktop targets build natively (GitHub has free arm64 runners for
    # public repositories, so no cross toolchains for rfd's GUI libraries);
    # Android (Termux) is the one cross build, linked with the NDK's clang —
    # rfd/open are cfg'd out there. Linux builds on Ubuntu 22.04, whose
    # glibc sets the oldest glibc the executable starts on (ADR 0034).
    name: Build (${{ matrix.target }})
    needs: [version, test]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            archive: zip
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
            archive: zip
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            archive: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm
            archive: tar.gz
          - target: x86_64-apple-darwin
            os: macos-26
            archive: tar.gz
          - target: aarch64-apple-darwin
            os: macos-26
            archive: tar.gz
          - target: aarch64-linux-android
            os: ubuntu-latest
            archive: tar.gz
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build deps
        if: runner.os == 'Linux' && matrix.target != 'aarch64-linux-android'
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Configure the Android NDK toolchain
        if: matrix.target == 'aarch64-linux-android'
        run: |
          NDK_HOME="${ANDROID_NDK_LATEST_HOME:-}"
          if [ -z "$NDK_HOME" ]; then
            NDK_HOME="$(ls -d "$ANDROID_HOME"/ndk/*/ 2>/dev/null | sort -V | tail -1)"
          fi
          TOOLCHAIN="$NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64"
          echo "CC_aarch64_linux_android=${TOOLCHAIN}/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
          echo "AR_aarch64_linux_android=${TOOLCHAIN}/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=${TOOLCHAIN}/bin/aarch64-linux-android24-clang" >> "$GITHUB_ENV"
      - name: Read the declared pnpm version
        id: pnpm
        # bash on every runner: Windows defaults to PowerShell, where
        # $GITHUB_OUTPUT is an undefined variable and the write is silently
        # lost, leaving pnpm/action-setup without a version.
        shell: bash
        run: >
          echo "version=$(jq -r .packageManager
          "$GITHUB_WORKSPACE/frontend/package.json" | cut -d@ -f2)"
          >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.pnpm.outputs.version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package (tar.gz)
        if: matrix.archive == 'tar.gz'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf ../../../gitreant-${{ matrix.target }}.tar.gz gitreant

      - name: Package (zip)
        if: matrix.archive == 'zip'
        shell: pwsh
        run: |
          Compress-Archive -Path target/${{ matrix.target }}/release/gitreant.exe -DestinationPath gitreant-${{ matrix.target }}.zip

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitreant-${{ matrix.target }}
          path: gitreant-${{ matrix.target }}.*

  deb:
    # The Debian packages (ADR 0034), built from the release executables and
    # installed with apt in Debian and Ubuntu containers before anything is
    # published. A prerelease tag rehearses this job too, with a package
    # version that sorts before the release (0.3.0~rc.1); the package
    # registry indexes stable releases only.
    name: Debian package (${{ matrix.arch }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - arch: arm64
            target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: gitreant-${{ matrix.target }}
          path: artifacts
      - name: Build the package and install it with apt
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq apt-utils
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          deb_version="$(sh packaging/apt/deb-version.sh "$version" "$GITHUB_REF_NAME")"
          tar xzf artifacts/gitreant-${{ matrix.target }}.tar.gz -C artifacts
          sh packaging/apt/build-deb.sh artifacts/gitreant "$deb_version" ${{ matrix.arch }} deb
          sh packaging/apt/install-test.sh deb "$version" ${{ matrix.arch }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gitreant-deb-${{ matrix.arch }}
          path: deb/*.deb

  release:
    name: Create Release
    needs: [build, deb]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      # Required for actions/attest-build-provenance to mint a Sigstore
      # signing certificate via the GitHub OIDC provider.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts
          merge-multiple: true

      - name: Write SHA256SUMS
        # The package registry checks every package against it before
        # indexing (ADR 0034), and anyone can check a download the same way.
        # Written outside the directory so it does not list itself.
        working-directory: artifacts
        run: |
          set -euo pipefail
          find . -maxdepth 1 -type f -printf '%P\n' | LC_ALL=C sort | xargs sha256sum >../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS

      - name: Attest build provenance
        # Signed SLSA provenance for every artifact, published before the
        # release itself so a failure aborts instead of shipping unattested
        # binaries. GitHub does not offer attestations on user-owned PRIVATE
        # repositories, so this arms itself automatically when the repo goes
        # public.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/*

      - name: Create release
        # A release takes its notes from its CHANGELOG.md section. A
        # prerelease has no section of its own, so its notes are generated.
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          case "$TAG" in
            *-*) notes=(--prerelease --generate-notes) ;;
            *)
              bash .github/scripts/release-notes.sh "${TAG#v}" >release-notes.md
              notes=(--notes-file release-notes.md)
              ;;
          esac
          gh release create "$TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "$TAG" \
            "${notes[@]}" \
            artifacts/*

  publish-crates:
    # Publish to crates.io via OIDC Trusted Publishing — no long-lived
    # CARGO_REGISTRY_TOKEN anywhere. crates.io versions cannot be reused, so
    # a prerelease tag never publishes. The release environment waits for
    # the owner's approval (rejecting it skips publishing) and admits only
    # v* tags; crates.io accepts tokens only from runs in that environment.
    # The crate ships the prebuilt frontend (see the include list in
    # Cargo.toml), so the frontend build must run before packaging.
    name: Publish to crates.io (OIDC)
    needs: release
    if: ${{ !contains(github.ref_name, '-') }}
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Linux build deps
        run: sudo apt-get update && sudo apt-get install -y libwayland-dev
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - name: Read the declared pnpm version
        id: pnpm
        run: >
          echo "version=$(jq -r .packageManager
          "$GITHUB_WORKSPACE/frontend/package.json" | cut -d@ -f2)"
          >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ steps.pnpm.outputs.version }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Exchange OIDC token for crates.io token
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish unless this version is already on crates.io
        # 200 means a rerun after a glitch: nothing to do. Any answer other
        # than 404 leaves the state unknown, so the job stops rather than
        # guess. --allow-dirty: the packaged frontend/dist is generated in
        # the previous step and never committed; the checkout is otherwise
        # pristine on CI.
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          status=$(curl -sS -o /dev/null -w '%{http_code}' \
            -A "gitreant release workflow (https://github.com/$GITHUB_REPOSITORY)" \
            "https://crates.io/api/v1/crates/gitreant/$version" || echo 000)
          case "$status" in
            200)
              echo "gitreant $version is already on crates.io; nothing to publish"
              exit 0
              ;;
            404) ;;
            *)
              echo "::error::crates.io answered $status for gitreant $version; not publishing"
              exit 1
              ;;
          esac
          cargo publish --locked --allow-dirty --dry-run
          cargo publish --locked --allow-dirty
